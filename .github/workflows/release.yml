name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm -r build

      # Opens (or updates) the "Version Packages" PR when changesets are pending.
      # When that PR is merged, no changesets remain, so this publishes instead.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # --no-git-tag: all packages share one version, so the single vX.Y.Z tag
          # cut below replaces changesets' four per-package tags.
          publish: pnpm changeset publish --no-git-tag
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # All packages share one version (fixed group), so a single vX.Y.Z tag and
      # one GitHub Release continue the existing tag series, rather than emitting
      # four near-identical per-package releases per version.
      - name: Tag and create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            exit 0
          fi
          NOTES=$(awk '/^## /{n++} n==1' packages/core/CHANGELOG.md | tail -n +2)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "${NOTES:-Release v$VERSION}" \
            --target "$GITHUB_SHA"
